<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="11:11 ✨">
<meta property="og:description" content="a tiny website. again. 1 minute, promise.">
<title>11:11 ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Same hand-drawn note cards as before, but at night: one card at a time under a starry sky */
:root{
  --bg:#141a3a; --bg2:#232b5c; --card:#fffaf2; --ink:#1d2147; --soft:#6c6a92;
  --gold:#ffc56b; --golddeep:#f0a83a; --pink:#ef6f93; --mint:#9fd8c4; --line:#e6dcc8;
  --display:"Gaegu","Comic Sans MS",cursive; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(#ffffff55 1px,transparent 1.4px),radial-gradient(#ffffff2a 1px,transparent 1.4px),linear-gradient(180deg,#0e1330,#2a2058);
  background-size:53px 61px,29px 37px,100% 100%;background-position:0 0,14px 9px,0 0;background-attachment:fixed}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:28px;padding-inline:16px;gap:14px}
.top{display:flex;align-items:center;gap:10px;width:100%;max-width:440px}
.dots{display:flex;gap:6px;flex:1}
.dots i{height:6px;flex:1;border-radius:6px;background:#ffffff26;transition:background .3s}
.dots i.on{background:var(--gold)}
.moon{border:0;background:none;font-size:22px;cursor:pointer;padding:4px;line-height:1;transition:transform .15s}
.moon:active{transform:scale(1.3) rotate(-15deg)}
.card{position:relative;width:100%;max-width:440px;background:var(--card);border:2px solid var(--ink);border-radius:22px 18px 24px 16px;
  padding:26px 22px 22px;box-shadow:6px 7px 0 #000a;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.card::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:22px;transform:translateX(-50%) rotate(-3deg);
  background:color-mix(in srgb,var(--gold) 70%,transparent);border-radius:3px}
@keyframes pop{from{transform:translateY(16px) scale(.96);opacity:.3}to{transform:none;opacity:1}}
h1,h2{font-family:var(--display);font-weight:700;line-height:1.05;margin:0 0 6px;text-wrap:balance}
h1{font-size:46px} h2{font-size:34px}
p{margin:0 0 10px}
.sub{color:var(--soft);font-size:15px}
.hand{font-family:var(--display);font-size:23px;line-height:1.2}
.clock{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;color:var(--golddeep);letter-spacing:.02em;margin:4px 0 8px}
.btn{font:800 16px var(--body);color:var(--ink);background:var(--gold);border:2px solid var(--ink);border-radius:999px;padding:12px 22px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{background:var(--golddeep)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.opt{font:600 14px/1.25 var(--body);color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.opt .e{font-size:26px;line-height:1}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.sel{background:#fff1d1}
.opt:focus-visible,.btn:focus-visible,.moon:focus-visible,textarea:focus-visible,a:focus-visible,.star:focus-visible,.flip:focus-visible{outline:3px dashed var(--golddeep);outline-offset:3px}
.react{margin-top:14px;padding:10px 14px;border-radius:12px;background:#f5efe2;font-family:var(--display);font-size:22px;line-height:1.2}
.react:empty{display:none}
/* wish star */
.starwrap{display:flex;justify-content:center;margin:18px 0 6px}
.star{width:132px;height:132px;border-radius:50%;border:2px dashed var(--line);background:radial-gradient(circle,#fff6dc 0 40%,transparent 70%);
  font-size:70px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:transform .2s;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.star.holding{animation:glow 1.1s linear forwards}
.star.done{animation:none;transform:scale(1.08);border-color:var(--gold)}
@keyframes glow{from{box-shadow:0 0 0 0 #ffc56b00}to{box-shadow:0 0 0 22px #ffc56b55;transform:scale(1.12)}}
.meter{height:8px;border-radius:8px;background:#efe6d3;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--gold);transition:width .1s linear}
/* my wish */
.wish{font-family:var(--display);font-size:28px;line-height:1.15;background:#f5efe2;border-radius:14px;padding:14px 16px;margin-top:10px;border:2px dashed var(--line)}
.telugu{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;color:var(--golddeep);margin:14px 0 2px}
/* sky of tossed thoughts */
textarea{width:100%;min-height:90px;resize:vertical;font:400 22px/1.25 var(--display);color:var(--ink);background:
  repeating-linear-gradient(#fff 0 31px,var(--line) 31px 32px);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;margin-top:12px}
.paper{position:fixed;z-index:10;font:400 20px/1.2 var(--display);color:#fff;pointer-events:none;max-width:80vw;text-align:center;
  animation:rise 2.2s cubic-bezier(.4,0,.6,1) forwards}
@keyframes rise{0%{opacity:1;transform:translate(-50%,0) scale(1);filter:blur(0)}70%{opacity:.8}100%{opacity:0;transform:translate(-50%,-60vh) scale(.2);filter:blur(4px)}}
/* flip notes */
.flips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.flip{position:relative;min-height:118px;border:2px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;padding:10px;box-shadow:3px 3px 0 var(--ink);
  font:400 19px/1.15 var(--display);color:var(--ink);text-align:center;display:grid;place-items:center;transition:background .25s,transform .12s}
.flip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.flip .q{font-size:34px}
.flip.open{background:#fff6d6}
.note{margin-top:14px;font-family:var(--display);font-size:23px;line-height:1.25;transform:rotate(-1deg);background:#fff6c9;padding:14px 16px;border-radius:4px;box-shadow:2px 3px 0 var(--line)}
.note .sig{text-align:right;margin-top:6px}
.fine{font-size:13px;color:var(--soft);margin-top:12px}
a.btn{text-decoration:none;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--ink);
  padding:10px 16px;border-radius:999px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;border:2px solid var(--ink)}
.toast.show{opacity:1;transform:translateX(-50%)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (max-width:380px){h1{font-size:40px}h2{font-size:30px}.clock{font-size:54px}.telugu{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="moon" id="moon" aria-label="the moon. tap it a few times">🌙</button>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const IG = "atharvaborade._";
const A = {};
let step = 0;
const $ = s => document.querySelector(s);
const card = $("#card");

const truths = [
  {q:"🍕", a:"you ate pizza at 6pm and called it a meal. iconic. (please eat properly tho)"},
  {q:"🎬", a:"that watchlist of yours is longer than my syllabus. it needs you. stay."},
  {q:"🔫", a:"you still owe me a mini militia rematch. i'm waiting 😤"},
  {q:"🫂", a:"a chill mom, a gym-freak bro, friends who stay up with you. that's a big team on your side."}
];

const steps = [
  // 0 intro
  () => `
    <div class="clock">11:11</div>
    <h1>hie nandu ✨</h1>
    <p class="hand">a tiny website. again. made by a kiddo.</p>
    <p class="sub">1 minute. no questions about food this time (okay maybe one). no voice notes. promise 🤞</p>
    <div class="row"><button class="btn" data-next>okay fine 🙄</button></div>`,
  // 1 make a wish
  () => `
    <h2>close your eyes. make a wish.</h2>
    <p class="sub">then press and hold the star till it fills up. don't tell me what it was. wishes stay secret.</p>
    <div class="starwrap"><button class="star ${A.wished?"done":""}" id="star" aria-label="press and hold to send your wish">⭐</button></div>
    <div class="meter" aria-hidden="true"><i id="meter" style="width:${A.wished?100:0}%"></i></div>
    <div class="react" id="react">${A.wished?"sent. it's up there now ✨":""}</div>
    <div class="row"><button class="btn" data-next ${A.wished?"":"disabled"}>next →</button></div>`,
  // 2 my wish
  () => `
    <h2>i made one too.</h2>
    <p class="sub">mine's not a secret.</p>
    <div class="wish">that you smile more than you cry. that's it.</div>
    <div class="telugu">nuvvu eppudu<br>happy ga undali</div>
    <p class="sub">teacher, check my telugu 👀</p>
    <div class="opts">
      ${opt("tel","perfect","✅","perfect")}
      ${opt("tel","close","😂","close enough")}
      ${opt("tel","kiddo","🙄","kiddo.")}
    </div>
    <div class="react" id="react"></div>
    <div class="row"><button class="btn" data-next ${A.tel?"":"disabled"}>next →</button></div>`,
  // 3 let it go
  () => `
    <h2>anything heavy from today?</h2>
    <p class="sub">type it, then let it go. it floats away and nobody reads it. not even me. the page doesn't save anything.</p>
    <textarea id="heavy" placeholder="today was…"></textarea>
    <div class="react" id="react"></div>
    <div class="row"><button class="btn" id="letgo">let it go 🎈</button><button class="btn ghost" data-next>${A.let?"next →":"skip, i'm okay"}</button></div>`,
  // 4 small true things
  () => `
    <h2>some small true things</h2>
    <p class="sub">tap to open. all four. i'll know if you skip 😏</p>
    <div class="flips">${truths.map((t,i)=>`<button class="flip ${(A.open||[]).includes(i)?"open":""}" data-f="${i}">${(A.open||[]).includes(i)?t.a:`<span class="q">${t.q}</span>`}</button>`).join("")}</div>
    <div class="row"><button class="btn" data-next>next →</button></div>`,
  // 5 end
  () => `
    <h2>that's it 🌙</h2>
    <div class="note">
      one sad day doesn't decide anything. you said you've always felt loved, by your mom, your friends, everyone. that's still true tonight. one person not seeing it doesn't change it.
      <br><br>no pressure, no proposals, nothing to reply to. i just wanted 11:11 to be about you for a minute.
      <br><br>now go sleep. (or one more episode. i know you will 🙄)
      <div class="sig">— kiddo</div>
    </div>
    <div class="row">
      <a class="btn" href="https://ig.me/m/${IG}" target="_blank" rel="noopener">tell me my telugu score →</a>
      <button class="btn ghost" id="again">make another wish ↺</button>
    </div>
    <p class="fine">nothing here gets sent or saved anywhere.</p>`
];

const telReact = {
  perfect:"yayyy 🎉 fast learner. told you.",
  close:"close enough is still a pass. 35/50 types 😌",
  kiddo:"okay okay. teach me properly then 😤"
};

function opt(k,v,e,l){return `<button class="opt ${A[k]===v?"sel":""}" data-k="${k}" data-v="${v}"><span class="e">${e}</span>${l}</button>`}

function render(){
  card.innerHTML = steps[step]();
  card.style.animation="none"; card.offsetHeight; card.style.animation="";
  document.querySelectorAll("#dots i").forEach((d,i)=>d.classList.toggle("on",i<=step));
  if (step===1) wishStar();
  if (step===3) $("#letgo").onclick=letGo;
  if (step===5){ shower(); $("#again").onclick=()=>{Object.keys(A).forEach(k=>delete A[k]);step=0;render()}; }
  const f = card.querySelector("textarea,.star,.opt,.flip,.btn"); if (f && step>0) f.focus({preventScroll:true});
}

card.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if (b.dataset.k){ A[b.dataset.k]=b.dataset.v;
    card.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle("sel",x===b));
    $("#react").textContent = telReact[b.dataset.v];
    card.querySelector("[data-next]").disabled=false;
    if (b.dataset.v==="perfect") sparkle();
  }
  if (b.dataset.f!==undefined){ const i=+b.dataset.f, o=A.open=A.open||[];
    if(!o.includes(i)){ o.push(i); b.classList.add("open"); b.textContent=truths[i].a; if(o.length===4) toast("all four. topper behaviour 😌"); } }
  if (b.hasAttribute("data-next")) next();
});
function next(){ step=Math.min(step+1,steps.length-1); render(); }

// press and hold the star
function wishStar(){
  const s=$("#star"), m=$("#meter"); if (A.wished) return;
  let t0=0, id=null; const need=1100;
  const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/need); m.style.width=(p*100)+"%";
    if(p>=1){ stop(true); return } id=requestAnimationFrame(tick) };
  const start=e=>{ e.preventDefault(); if(A.wished) return; t0=performance.now(); s.classList.add("holding"); id=requestAnimationFrame(tick) };
  const stop=ok=>{ cancelAnimationFrame(id); s.classList.remove("holding");
    if(ok===true){ A.wished=true; s.classList.add("done"); shooting(); $("#react").textContent="sent. it's up there now ✨"; card.querySelector("[data-next]").disabled=false; }
    else if(!A.wished){ m.style.width="0%"; $("#react").textContent="hold it a little longer. wishes take a second 🙂"; } };
  s.addEventListener("pointerdown",start); s.addEventListener("pointerup",()=>stop()); s.addEventListener("pointerleave",()=>{ if(s.classList.contains("holding")) stop() });
  s.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat) start(e) });
  s.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") stop() });
}

// let the heavy thing float away
function letGo(){
  const t=$("#heavy"), txt=t.value.trim();
  if(!txt){ $("#react").textContent="write something first. even one word 🙂"; return; }
  const r=t.getBoundingClientRect(), el=document.createElement("div");
  el.className="paper"; el.textContent=txt.length>60?txt.slice(0,60)+"…":txt;
  el.style.left=(r.left+r.width/2)+"px"; el.style.top=(r.top)+"px";
  document.body.appendChild(el); setTimeout(()=>el.remove(),2300);
  t.value=""; A.let=(A.let||0)+1;
  const msgs=["gone. it's not yours to carry tonight 🎈","another one floated off. feel lighter?","keep going if you want. i'm not reading, promise"];
  setTimeout(()=>{ $("#react").textContent=msgs[Math.min(A.let-1,2)]; const n=card.querySelector("[data-next]"); n.textContent="next →"; },700);
}

function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2800)}

// secret moon
let taps=0, tapT;
$("#moon").onclick=()=>{ taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,1500);
  if (taps>=5){ taps=0; toast("the moon says go drink water and sleep before 4 today 😴"); sparkle(); } };

// sky effects
const cv=$("#fx"), cx=cv.getContext("2d"); let parts=[], raf;
const dpr=()=>devicePixelRatio||1;
function size(){cv.width=innerWidth*dpr(); cv.height=innerHeight*dpr()}
addEventListener("resize",size); size();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function add(p){ parts.push(p); if(!raf) loop(); }
function loop(){ cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.life--; p.x+=p.vx; p.y+=p.vy;
    if(p.kind==="trail"){ const g=cx.createLinearGradient(p.x,p.y,p.x-p.vx*14,p.y-p.vy*14); g.addColorStop(0,"#fff6dcff"); g.addColorStop(1,"#ffc56b00");
      cx.strokeStyle=g; cx.lineWidth=3*dpr(); cx.lineCap="round"; cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(p.x-p.vx*14,p.y-p.vy*14); cx.stroke(); }
    else { cx.globalAlpha=Math.max(0,Math.min(1,p.life/40)); cx.font=`${p.s}px serif`; cx.fillText(p.c,p.x,p.y); cx.globalAlpha=1; } });
  parts=parts.filter(p=>p.life>0 && p.y<cv.height+60 && p.x<cv.width+200); raf=parts.length?requestAnimationFrame(loop):null; if(!raf) cx.clearRect(0,0,cv.width,cv.height); }
function shooting(n=3){ if(reduce) return; const d=dpr();
  for(let i=0;i<n;i++) setTimeout(()=>add({kind:"trail",x:Math.random()*cv.width*.4,y:Math.random()*cv.height*.3,vx:(9+Math.random()*5)*d,vy:(4+Math.random()*3)*d,life:70}),i*280); }
function sparkle(n=26){ if(reduce) return; const d=dpr(), ch=["✨","⭐","🌟"];
  for(let i=0;i<n;i++) add({kind:"glyph",c:ch[i%3],x:Math.random()*cv.width,y:-20*d-Math.random()*cv.height*.3,vx:(Math.random()-.5)*d,vy:(1.5+Math.random()*2.5)*d,s:(14+Math.random()*14)*d,life:260}); }
function shower(){ shooting(5); setTimeout(()=>sparkle(34),500); }

document.getElementById("dots").innerHTML=steps.map(()=>"<i></i>").join("");
render();
</script>
</body>
</html>
