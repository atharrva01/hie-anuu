<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d48">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="11:11 ✨">
<meta property="og:description" content="a tiny website. again. 1 minute, promise.">
<title>11:11 ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Phone-first night sky: twinkling stars behind one sticker-covered note card at a time, a sleepy moon buddy on top */
:root{
  --bg1:#141738; --bg2:#2e2463; --bg3:#4a2f6e;
  --card:#fffaf3; --ink:#2a2554; --soft:#7b7499;
  --gold:#ffcf73; --golddeep:#f3a93c; --pink:#ff8fb1; --pinksoft:#ffe0ea; --lav:#e9e2ff; --mint:#a8e6cf; --line:#eee3cf;
  --display:"Gaegu","Comic Sans MS",cursive; --body:"Nunito",-apple-system,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg1)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg3) 100%)}
/* sky layer (fixed div instead of background-attachment, which iOS ignores) */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg3) 100%)}
.sky i{position:absolute;border-radius:50%;background:#fff;animation:tw var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s);opacity:.3}
@keyframes tw{50%{opacity:1;transform:scale(1.4)}}
.sky .cloud{position:absolute;font-size:64px;opacity:.10;filter:blur(1px);animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}

.wrap{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(26px + env(safe-area-inset-bottom,0px));gap:12px}
.top{display:flex;align-items:center;gap:12px;width:100%;max-width:420px}
.dots{display:flex;gap:6px;flex:1}
.dots i{height:8px;flex:1;border-radius:8px;background:#ffffff22;transition:background .3s}
.dots i.on{background:var(--gold)}
.moon{border:0;background:none;padding:0;width:52px;height:52px;cursor:pointer;flex:none;animation:bob 3s ease-in-out infinite;touch-action:manipulation}
.moon svg{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}

.card{position:relative;width:100%;max-width:420px;background:var(--card);border:2.5px solid var(--ink);border-radius:28px 24px 30px 22px;
  padding:28px 20px 20px;box-shadow:0 6px 0 var(--ink),0 18px 40px #0007;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.card::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:24px;transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(45deg,#ffcf73cc 0 8px,#ffe2a6cc 8px 16px);border-radius:4px}
.sticker{position:absolute;font-size:34px;line-height:1;transform:rotate(14deg);right:-10px;top:-14px;filter:drop-shadow(0 2px 0 #0003);animation:wig 2.4s ease-in-out infinite}
.sticker.l{right:auto;left:-10px;top:auto;bottom:-12px;transform:rotate(-12deg);font-size:28px;animation-delay:.6s}
@keyframes wig{50%{transform:rotate(-6deg) scale(1.06)}}
@keyframes pop{from{transform:translateY(20px) scale(.94);opacity:.2}to{transform:none;opacity:1}}

h1,h2{font-family:var(--display);font-weight:700;line-height:1.02;margin:0 0 6px;text-wrap:balance}
h1{font-size:46px} h2{font-size:35px}
p{margin:0 0 10px}
.sub{color:var(--soft);font-size:15.5px}
.hand{font-family:var(--display);font-size:24px;line-height:1.15}
.clock{display:inline-block;font-family:var(--display);font-weight:700;font-size:58px;line-height:1;color:var(--ink);background:var(--gold);
  padding:4px 16px 0;border-radius:16px;border:2.5px solid var(--ink);transform:rotate(-3deg);margin:0 0 14px;box-shadow:0 4px 0 var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;font:800 17px var(--body);color:var(--ink);background:var(--gold);
  border:2.5px solid var(--ink);border-radius:999px;padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.pink{background:var(--pink)}
.btn:disabled{opacity:.4}
.row{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.row .btn{width:100%}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.opt{font:700 14px/1.2 var(--body);color:var(--ink);background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:12px 4px;min-height:84px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .2s;touch-action:manipulation}
.opt .e{font-size:30px;line-height:1}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.sel{background:var(--pinksoft);transform:translateY(2px) rotate(-2deg)}
.opt:focus-visible,.btn:focus-visible,.moon:focus-visible,textarea:focus-visible,a:focus-visible,.star:focus-visible,.flip:focus-visible{outline:3px dashed var(--golddeep);outline-offset:3px}
.react{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--lav);font-family:var(--display);font-size:23px;line-height:1.15;animation:pop .35s ease}
.react:empty{display:none}

/* kawaii wish star: press and hold */
.starwrap{display:flex;justify-content:center;margin:14px 0 4px}
.star{position:relative;width:170px;height:170px;border:0;background:none;padding:0;cursor:pointer;touch-action:none;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;animation:float 2.6s ease-in-out infinite}
.star svg{width:100%;height:100%;display:block;overflow:visible}
.star .halo{transition:r .2s, opacity .2s}
@keyframes float{50%{transform:translateY(-6px) rotate(3deg)}}
.star.holding{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-3deg) scale(1.05)}75%{transform:rotate(3deg) scale(1.05)}}
.star .eyes-closed{display:none} .star.done .eyes-open{display:none} .star.done .eyes-closed{display:inline}
.hint{text-align:center;font-family:var(--display);font-size:20px;color:var(--soft);margin:2px 0 0}
.meter{height:12px;border-radius:12px;background:#f2e9d8;border:2px solid var(--ink);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--gold) 0 10px,var(--golddeep) 10px 20px)}

/* my wish */
.wish{font-family:var(--display);font-size:28px;line-height:1.12;background:var(--pinksoft);border-radius:18px;padding:14px 16px;margin-top:8px;border:2.5px dashed var(--pink)}
.telugu{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;color:var(--golddeep);margin:16px 0 4px;text-shadow:0 2px 0 #fff}

/* let it go */
textarea{width:100%;min-height:110px;resize:none;font:400 22px/1.3 var(--display);color:var(--ink);-webkit-appearance:none;appearance:none;
  background:repeating-linear-gradient(#fff 0 32px,var(--line) 32px 33px);border:2.5px solid var(--ink);border-radius:16px;padding:6px 12px;margin-top:12px}
.balloon{position:fixed;z-index:10;pointer-events:none;text-align:center;animation:rise 2.6s cubic-bezier(.4,0,.6,1) forwards}
.balloon .b{font-size:54px;line-height:1;display:block}
.balloon .t{font:400 18px/1.15 var(--display);color:#fff;max-width:60vw;display:block;margin-top:2px}
@keyframes rise{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(calc(-50% + 30px),-70vh) rotate(8deg)}}

/* envelopes */
.flips{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.flip{position:relative;min-height:128px;border:2.5px solid var(--ink);border-radius:18px;background:#fff;cursor:pointer;padding:12px 10px;box-shadow:0 4px 0 var(--ink);
  font:400 18.5px/1.12 var(--display);color:var(--ink);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .25s;touch-action:manipulation}
.flip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.flip .q{font-size:38px;line-height:1}
.flip .tap{font:700 12px var(--body);color:var(--soft);letter-spacing:.04em}
.flip.open{background:#fff6d4;animation:flip .4s ease}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:none}}
.note{margin-top:14px;font-family:var(--display);font-size:23.5px;line-height:1.22;transform:rotate(-1.2deg);background:#fff6c9;padding:16px 16px 14px;border-radius:6px;box-shadow:0 4px 0 var(--line);position:relative}
.note::after{content:"🌸";position:absolute;right:-8px;top:-14px;font-size:28px;transform:rotate(18deg)}
.note .sig{text-align:right;margin-top:8px}
.fine{font-size:13px;color:var(--soft);margin-top:12px;text-align:center}
a.btn{text-decoration:none}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--gold);color:var(--ink);
  padding:12px 18px;border-radius:999px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center;border:2.5px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.toast.show{opacity:1;transform:translateX(-50%)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (max-width:360px){h1{font-size:40px}h2{font-size:31px}.clock{font-size:50px}.telugu{font-size:31px}.star{width:150px;height:150px}.flip{font-size:17px}}
@media (min-width:600px){.row{flex-direction:row}.row .btn{width:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="sky" id="sky" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<div class="wrap">
  <div class="top">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="moon" id="moon" aria-label="a sleepy moon. tap it a few times">
      <svg viewBox="0 0 60 60" aria-hidden="true">
        <circle cx="30" cy="30" r="24" fill="#fff3c4" stroke="#2a2554" stroke-width="2.5"/>
        <circle cx="40" cy="20" r="4" fill="#f6e3a0"/><circle cx="20" cy="42" r="3" fill="#f6e3a0"/>
        <path d="M19 29q3 3 6 0M35 29q3 3 6 0" fill="none" stroke="#2a2554" stroke-width="2.4" stroke-linecap="round"/>
        <ellipse cx="17" cy="35" rx="3.5" ry="2.2" fill="#ff8fb1" opacity=".7"/><ellipse cx="43" cy="35" rx="3.5" ry="2.2" fill="#ff8fb1" opacity=".7"/>
        <path d="M27 37q3 2.5 6 0" fill="none" stroke="#2a2554" stroke-width="2.2" stroke-linecap="round"/>
        <text x="46" y="10" font-size="10" font-family="Gaegu,cursive" fill="#fff">z</text><text x="52" y="4" font-size="7" font-family="Gaegu,cursive" fill="#fff">z</text>
      </svg>
    </button>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const IG = "atharvaborade._";
const A = {};
let step = 0;
const $ = s => document.querySelector(s);
const card = $("#card");

const starSVG = `
<svg viewBox="-10 -10 120 120" aria-hidden="true">
  <circle class="halo" cx="50" cy="52" r="0" fill="#ffcf73" opacity=".35"/>
  <path d="M50 6 L62 36 L94 38 L69 58 L77 90 L50 72 L23 90 L31 58 L6 38 L38 36 Z" fill="#ffcf73" stroke="#2a2554" stroke-width="3.5" stroke-linejoin="round"/>
  <g class="eyes-open"><circle cx="41" cy="50" r="4.2" fill="#2a2554"/><circle cx="59" cy="50" r="4.2" fill="#2a2554"/>
    <circle cx="42.4" cy="48.6" r="1.4" fill="#fff"/><circle cx="60.4" cy="48.6" r="1.4" fill="#fff"/></g>
  <g class="eyes-closed"><path d="M36 51q5-5 10 0M54 51q5-5 10 0" fill="none" stroke="#2a2554" stroke-width="3" stroke-linecap="round"/></g>
  <ellipse cx="34" cy="59" rx="5" ry="3" fill="#ff8fb1" opacity=".75"/><ellipse cx="66" cy="59" rx="5" ry="3" fill="#ff8fb1" opacity=".75"/>
  <path d="M45 60q5 4.5 10 0" fill="none" stroke="#2a2554" stroke-width="3" stroke-linecap="round"/>
</svg>`;

const truths = [
  {q:"🍕", a:"you ate pizza at 6pm and called it a meal. iconic. (please eat properly tho)"},
  {q:"🎬", a:"that watchlist of yours is longer than my syllabus. it needs you. stay."},
  {q:"🔫", a:"you still owe me a mini militia rematch. i'm waiting 😤"},
  {q:"🫂", a:"a chill mom, a gym-freak bro, friends who stay up with you. that's a big team on your side."}
];

const stickers = [["🌙","⭐"],["✨","🌟"],["🎀","💫"],["🎈","☁️"],["💌","🌸"],["🌷","✨"]];

const steps = [
  // 0 intro
  () => `
    <div class="clock">11:11</div>
    <h1>hie nandu ✨</h1>
    <p class="hand">a tiny website. again. made by a kiddo.</p>
    <p class="sub">1 minute. no food questions this time (okay maybe one). no voice notes. promise 🤞</p>
    <div class="row"><button class="btn" data-next>okay fine 🙄</button></div>`,
  // 1 make a wish
  () => `
    <h2>close your eyes. make a wish.</h2>
    <p class="sub">then press and hold the star till the bar fills. don't tell me what it was. wishes stay secret 🤫</p>
    <div class="starwrap"><button class="star ${A.wished?"done":""}" id="star" aria-label="press and hold to send your wish">${starSVG}</button></div>
    <p class="hint" id="hint">${A.wished?"wish sent ✨":"press & hold me 👆"}</p>
    <div class="meter" aria-hidden="true"><i id="meter" style="width:${A.wished?100:0}%"></i></div>
    <div class="react" id="react">${A.wished?"sent. it's up there now ✨":""}</div>
    <div class="row"><button class="btn" data-next ${A.wished?"":"disabled"}>next →</button></div>`,
  // 2 my wish
  () => `
    <h2>i made one too.</h2>
    <p class="sub">mine's not a secret.</p>
    <div class="wish">that you smile more than you cry. that's it 🙂</div>
    <div class="telugu">nuvvu eppudu<br>happy ga undali</div>
    <p class="sub">teacher, check my telugu 👀</p>
    <div class="opts">
      ${opt("tel","perfect","💯","perfect")}
      ${opt("tel","close","😂","close enough")}
      ${opt("tel","kiddo","🙄","kiddo.")}
    </div>
    <div class="react" id="react"></div>
    <div class="row"><button class="btn" data-next ${A.tel?"":"disabled"}>next →</button></div>`,
  // 3 let it go
  () => `
    <h2>anything heavy from today?</h2>
    <p class="sub">type it, tie it to a balloon, let it go. nobody reads it. not even me. this page saves nothing.</p>
    <textarea id="heavy" placeholder="today was…" enterkeyhint="done"></textarea>
    <div class="react" id="react"></div>
    <div class="row"><button class="btn pink" id="letgo">let it go 🎈</button><button class="btn ghost" data-next>${A.let?"next →":"skip, i'm okay"}</button></div>`,
  // 4 small true things
  () => `
    <h2>some small true things</h2>
    <p class="sub">tap to open. all four. i'll know if you skip 😏</p>
    <div class="flips">${truths.map((t,i)=>flip(t,i)).join("")}</div>
    <div class="row"><button class="btn" data-next>next →</button></div>`,
  // 5 end
  () => `
    <h2>that's it 🌙</h2>
    <div class="note">
      one sad day doesn't decide anything. you said you've always felt loved, by your mom, your friends, everyone. that's still true tonight. one person not seeing it doesn't change it.
      <br><br>no pressure, no proposals, nothing to reply to. i just wanted 11:11 to be about you for a minute.
      <br><br>now go sleep. (or one more episode. i know you will 🙄)
      <div class="sig">— kiddo</div>
    </div>
    <div class="row">
      <a class="btn" href="https://ig.me/m/${IG}">tell me my telugu score 💌</a>
      <button class="btn ghost" id="again">make another wish ↺</button>
    </div>
    <p class="fine">nothing here gets sent or saved anywhere.</p>`
];

const telReact = {
  perfect:"yayyy 🎉 fast learner. told you.",
  close:"close enough is still a pass. 35/50 types 😌",
  kiddo:"okay okay. teach me properly then 😤"
};

function opt(k,v,e,l){return `<button class="opt ${A[k]===v?"sel":""}" data-k="${k}" data-v="${v}"><span class="e">${e}</span>${l}</button>`}
function flip(t,i){const o=(A.open||[]).includes(i); return `<button class="flip ${o?"open":""}" data-f="${i}">${o?t.a:`<span class="q">${t.q}</span><span class="tap">tap me</span>`}</button>`}

function render(){
  const [s1,s2]=stickers[step];
  card.innerHTML = `<span class="sticker" aria-hidden="true">${s1}</span><span class="sticker l" aria-hidden="true">${s2}</span>` + steps[step]();
  card.style.animation="none"; card.offsetHeight; card.style.animation="";
  document.querySelectorAll("#dots i").forEach((d,i)=>d.classList.toggle("on",i<=step));
  if (step===1) wishStar();
  if (step===3) $("#letgo").onclick=letGo;
  if (step===5){ shower(); $("#again").onclick=()=>{Object.keys(A).forEach(k=>delete A[k]);step=0;render()}; }
  window.scrollTo({top:0,behavior:"smooth"});
}

card.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if (b.dataset.k){ A[b.dataset.k]=b.dataset.v;
    card.querySelectorAll(`[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.toggle("sel",x===b));
    $("#react").textContent = telReact[b.dataset.v];
    card.querySelector("[data-next]").disabled=false;
    if (b.dataset.v==="perfect") sparkle();
  }
  if (b.dataset.f!==undefined){ const i=+b.dataset.f, o=A.open=A.open||[];
    if(!o.includes(i)){ o.push(i); b.classList.add("open"); b.textContent=truths[i].a; if(o.length===4){ toast("all four. topper behaviour 😌"); sparkle(16); } } }
  if (b.hasAttribute("data-next")) next();
});
function next(){ if(document.activeElement) document.activeElement.blur(); step=Math.min(step+1,steps.length-1); render(); }

// press and hold the star
function wishStar(){
  const s=$("#star"), m=$("#meter"), halo=s.querySelector(".halo"); if (A.wished) return;
  let t0=0, id=null, on=false; const need=1200;
  const tick=()=>{ const p=Math.min(1,(performance.now()-t0)/need); m.style.width=(p*100)+"%"; halo.setAttribute("r",String(20+p*40));
    if(p>=1){ stop(true); return } id=requestAnimationFrame(tick) };
  const start=e=>{ e.preventDefault(); if(A.wished||on) return; on=true; t0=performance.now(); s.classList.add("holding"); $("#hint").textContent="keep holding… 🤞"; id=requestAnimationFrame(tick) };
  const stop=ok=>{ if(!on) return; on=false; cancelAnimationFrame(id); s.classList.remove("holding");
    if(ok===true){ A.wished=true; s.classList.add("done"); halo.setAttribute("r","0"); shooting(4); sparkle(18);
      $("#hint").textContent="wish sent ✨"; $("#react").textContent="sent. it's up there now ✨"; card.querySelector("[data-next]").disabled=false; }
    else { m.style.width="0%"; halo.setAttribute("r","0"); $("#hint").textContent="press & hold me 👆"; $("#react").textContent="a little longer. wishes take a second 🙂"; } };
  s.addEventListener("pointerdown",start);
  ["pointerup","pointercancel"].forEach(ev=>s.addEventListener(ev,()=>stop()));
  s.addEventListener("contextmenu",e=>e.preventDefault());
  s.addEventListener("keydown",e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat) start(e) });
  s.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") stop() });
}

// tie the heavy thing to a balloon
function letGo(){
  const t=$("#heavy"), txt=t.value.trim();
  if(!txt){ $("#react").textContent="write something first. even one word 🙂"; return; }
  t.blur();
  const r=t.getBoundingClientRect(), el=document.createElement("div");
  el.className="balloon";
  el.innerHTML=`<span class="b">🎈</span><span class="t"></span>`; el.querySelector(".t").textContent=txt.length>40?txt.slice(0,40)+"…":txt;
  el.style.left=(r.left+r.width/2)+"px"; el.style.top=Math.max(40,r.top-20)+"px";
  document.body.appendChild(el); setTimeout(()=>el.remove(),2700);
  t.value=""; A.let=(A.let||0)+1;
  const msgs=["gone. it's not yours to carry tonight 🎈","another one floated off. feel lighter?","keep going if you want. i'm not reading, promise"];
  setTimeout(()=>{ $("#react").textContent=msgs[Math.min(A.let-1,2)]; card.querySelector("[data-next]").textContent="next →"; },700);
}

function toast(m){const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2800)}

// sleepy moon secret
let taps=0, tapT;
$("#moon").onclick=()=>{ taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,1500);
  if (taps>=5){ taps=0; toast("the moon says: drink water & sleep before 4 today 😴"); sparkle(); } };

// twinkling sky
(function(){ const sky=$("#sky"); let h="";
  for(let i=0;i<70;i++){ const s=Math.random()<.15?3:Math.random()<.5?2:1.3;
    h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;--d:${2+Math.random()*3}s;--dl:${-Math.random()*4}s"></i>`; }
  h+=`<span class="cloud" style="top:12%">☁️</span><span class="cloud" style="top:68%;animation-delay:-22s;animation-duration:55s">☁️</span>`;
  sky.innerHTML=h; })();

// effects canvas
const cv=$("#fx"), cx=cv.getContext("2d"); let parts=[], raf;
const dpr=()=>Math.min(devicePixelRatio||1,2);
function size(){cv.width=innerWidth*dpr(); cv.height=innerHeight*dpr()}
addEventListener("resize",size); size();
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function add(p){ parts.push(p); if(!raf) raf=requestAnimationFrame(loop); }
function loop(){ cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.life--; p.x+=p.vx; p.y+=p.vy;
    if(p.kind==="trail"){ const g=cx.createLinearGradient(p.x,p.y,p.x-p.vx*14,p.y-p.vy*14); g.addColorStop(0,"#fff6dcff"); g.addColorStop(1,"#ffcf7300");
      cx.strokeStyle=g; cx.lineWidth=3*dpr(); cx.lineCap="round"; cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(p.x-p.vx*14,p.y-p.vy*14); cx.stroke(); }
    else { p.r+=p.vr; cx.globalAlpha=Math.max(0,Math.min(1,p.life/40)); cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.font=`${p.s}px serif`; cx.fillText(p.c,0,0); cx.restore(); cx.globalAlpha=1; } });
  parts=parts.filter(p=>p.life>0 && p.y<cv.height+60 && p.x<cv.width+200); raf=parts.length?requestAnimationFrame(loop):null; if(!raf) cx.clearRect(0,0,cv.width,cv.height); }
function shooting(n=3){ if(reduce) return; const d=dpr();
  for(let i=0;i<n;i++) setTimeout(()=>add({kind:"trail",x:Math.random()*cv.width*.4,y:Math.random()*cv.height*.3,vx:(7+Math.random()*5)*d,vy:(3.5+Math.random()*3)*d,life:80}),i*280); }
function sparkle(n=26){ if(reduce) return; const d=dpr(), ch=["✨","⭐","🌟","💛"];
  for(let i=0;i<n;i++) add({kind:"glyph",c:ch[i%4],x:Math.random()*cv.width,y:-20*d-Math.random()*cv.height*.3,vx:(Math.random()-.5)*d,vy:(1.5+Math.random()*2.5)*d,r:0,vr:(Math.random()-.5)*.06,s:(14+Math.random()*14)*d,life:280}); }
function shower(){ shooting(5); setTimeout(()=>sparkle(34),500); }

document.getElementById("dots").innerHTML=steps.map(()=>"<i></i>").join("");
render();
</script>
</body>
